<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yuansu Drive - 分享文件</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f7f9fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1e293b;
    }

    .card {
      max-width: 700px;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.08), 0 8px 16px -6px rgba(0, 0, 0, 0.02);
      padding: 2rem 2rem 1.8rem;
      border: 1px solid rgba(226, 232, 240, 0.6);
      animation: fadeUp 0.5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .share-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .avatar-letter {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .share-meta { display: flex; flex-direction: column; gap: 4px; }

    .share-title {
      font-size: 1rem;
      font-weight: 500;
      color: #0f172a;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .share-user { color: #2563eb; font-weight: 600; text-decoration: none; }
    .share-user:hover { text-decoration: underline; }

    .share-detail {
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #eef2f6;
      padding: 0.25rem 0.7rem;
      border-radius: 30px;
      font-size: 0.72rem;
      font-weight: 500;
      color: #334155;
    }

    .badge svg { width: 14px; height: 14px; fill: #475569; }

    .file-preview {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #fafcff;
      padding: 1.2rem;
      border-radius: 20px;
      border: 1px solid #e9eef3;
      margin-bottom: 1.8rem;
    }

    .file-icon {
      width: 56px;
      height: 56px;
      background: #eef4ff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .file-icon svg { width: 28px; height: 28px; fill: #2563eb; }
    .file-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .file-info { flex: 1; min-width: 0; }

    .file-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0b1e3a;
      word-break: break-all;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .file-size {
      font-size: 0.8rem;
      color: #64748b;
      background: #eef2f6;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-weight: 500;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.7rem 1.6rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid #d0d9e8;
      cursor: pointer;
      background: white;
      color: #1e293b;
      text-decoration: none;
      font-family: inherit;
      line-height: 1.2;
      white-space: nowrap;
    }

    .btn svg { width: 18px; height: 18px; fill: currentColor; }

    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    .btn-outline {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #1e293b;
    }

    .btn-group { display: flex; align-items: center; gap: 0; }
    .btn-group .btn { border-radius: 0; border-right-width: 0; }
    .btn-group .btn:first-child {
      border-top-left-radius: 40px;
      border-bottom-left-radius: 40px;
      padding-left: 1.4rem;
      padding-right: 1.4rem;
    }
    .btn-group .btn:last-child {
      border-top-right-radius: 40px;
      border-bottom-right-radius: 40px;
      border-right-width: 1px;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    .btn-group .btn:not(:last-child) { border-right: 1px solid #e2e8f0; }
    .btn-group .btn-primary:not(:last-child) { border-right-color: #3b82f6; }
    .btn-icon-only { padding: 0.7rem 0.9rem; }

    .footnote {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eef2f6;
      padding-top: 1.2rem;
      margin-top: 0.6rem;
      font-size: 0.75rem;
      color: #94a3b8;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footnote a { color: #64748b; text-decoration: none; }
    .footnote a:hover { color: #2563eb; }
    .footnote .dot { margin: 0 6px; color: #cbd5e1; }

    @media (max-width: 480px) {
      body { padding: 0.8rem; }
      .card { padding: 1.5rem 1.2rem; border-radius: 24px; }
      .file-preview { padding: 1rem; }
      .file-icon { width: 48px; height: 48px; }
      .file-icon svg { width: 24px; height: 24px; }
      .file-name { font-size: 1rem; }
      .btn { padding: 0.6rem 1.2rem; font-size: 0.85rem; }
      .btn-group .btn:first-child { padding-left: 1rem; padding-right: 1rem; }
      .btn-group .btn:last-child { padding-left: 0.7rem; padding-right: 0.7rem; }
      .action-buttons { gap: 10px; }
      .share-header { gap: 10px; }
      .share-title { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="share-header">
      <div class="avatar-letter" id="avatarLetter"></div>
      <div class="share-meta">
        <div class="share-title">
          <a href="#" class="share-user" id="shareUser"></a>
          <span id="shareDesc"></span>
        </div>
        <div class="share-detail" id="shareDetail"></div>
      </div>
    </div>

    <div class="file-preview">
      <div class="file-icon" id="fileIcon"></div>
      <div class="file-info">
        <div class="file-name">
          <span id="fileName"></span>
          <span class="file-size" id="fileSize"></span>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-primary" type="button" aria-label="保存" id="saveBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 6.25V8h4.629a.75.75 0 0 0 .53-.22l1.53-1.53-1.53-1.53a.75.75 0 0 0-.53-.22H5.25A1.75 1.75 0 0 0 3.5 6.25m-1.5 0A3.25 3.25 0 0 1 5.25 3h2.879a2.25 2.25 0 0 1 1.59.659L11.562 5.5h7.189A3.25 3.25 0 0 1 22 8.75v5.627a4.728 4.728 0 0 0-1.5-.71V8.75A1.75 1.75 0 0 0 18.75 7h-7.19L9.72 8.841a2.25 2.25 0 0 1-1.591.659H3.5v8.25c0 .966.784 1.75 1.75 1.75h5.916c.149.545.392 1.052.71 1.5H5.25A3.25 3.25 0 0 1 2 17.75zm21 12a3.75 3.75 0 0 0-3.75-3.75l-.102.007A.75.75 0 0 0 19.25 16l.154.005a2.25 2.25 0 0 1-.154 4.495l-.003.005l-.102.007a.75.75 0 0 0 .108 1.493V22l.2-.005A3.75 3.75 0 0 0 23 18.25m-6.5-3a.75.75 0 0 0-.75-.75l-.2.005a3.75 3.75 0 0 0 .2 7.495l.102-.007a.75.75 0 0 0-.102-1.493l-.154-.005A2.25 2.25 0 0 1 15.75 16l.102-.007a.75.75 0 0 0 .648-.743m3.5 3a.75.75 0 0 0-.75-.75h-3.5l-.102.007A.75.75 0 0 0 15.75 19h3.5l.102-.007A.75.75 0 0 0 20 18.25"/>
        </svg>
        保存
      </button>

      <div class="btn-group">
        <a class="btn btn-outline" id="downloadBtn" href="#" download>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.25 20.5a.75.75 0 1 1 0 1.5l-13 .005a.75.75 0 1 1 0-1.5zM11.648 2.014l.102-.007a.75.75 0 0 1 .743.648l.007.102l-.001 13.685l3.722-3.72a.75.75 0 0 1 .976-.073l.085.073a.75.75 0 0 1 .072.976l-.073.084l-4.997 4.997a.75.75 0 0 1-.976.073l-.085-.073l-5.003-4.996a.75.75 0 0 1 .976-1.134l.084.072l3.719 3.714L11 2.756a.75.75 0 0 1 .648-.743l.102-.007z"/>
          </svg>
          下载
        </a>
        <a class="btn btn-outline btn-icon-only" id="downloadIconBtn" href="#" download aria-label="下载选项">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px;">
            <path d="M6.102 8c-1.074 0-1.648 1.265-.94 2.073l5.521 6.31a1.75 1.75 0 0 0 2.634 0l5.522-6.31c.707-.808.133-2.073-.94-2.073H6.101Z"/>
          </svg>
        </a>
      </div>
    </div>

    <div class="footnote">
      <div>
        <a href="yuansutech.github.io/sh-pan/index.html" target="_blank" rel="noopener">返回首页</a>
        <span class="dot">|</span>
      </div>
      <div style="color: #b0c0d4;">Yuansu Drive · 安全分享</div>
    </div>
  </div>

  <script>
    (function () {
      const p = new URLSearchParams(location.search);
      const name = p.get('name') || '';
      const icon = p.get('icon') || '';
      const download = p.get('download') || '';

      document.getElementById('fileName').textContent = name;
      document.getElementById('shareUser').textContent = name;

      if (icon) {
        const box = document.getElementById('fileIcon');
        box.innerHTML = '';
        const img = document.createElement('img');
        img.src = icon;
        img.alt = name;
        box.appendChild(img);
      }

      const btns = [
        document.getElementById('downloadBtn'),
        document.getElementById('downloadIconBtn')
      ];
      btns.forEach(function (b) {
        if (download) {
          b.href = download;
          b.setAttribute('download', name);
        }
      });

      document.getElementById('saveBtn').onclick = function () {
        if (download) window.open(download, '_blank');
      };
    })();
  </script>
</body>
</html>
